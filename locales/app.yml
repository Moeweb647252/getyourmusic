alert:
  silence_title:
    en: No sound is reaching GetYourMusic
  silence_loopback:
    en: macOS may be blocking system audio recording. Allow GetYourMusic under System Audio Recording in Privacy & Security, then start recording again.
  silence_input:
    en: "Nothing is arriving from %{source}. Route your player’s output to this device, or choose another source."
  now_playing_title:
    en: Can’t detect what’s playing
  now_playing_body:
    en: "Recordings are split into songs using the system’s Now Playing information, which isn’t available right now. Details: %{detail}"
  no_loopback:
    en: This version of macOS can’t record system audio directly. Install a loopback driver such as BlackHole and select it as the source.

