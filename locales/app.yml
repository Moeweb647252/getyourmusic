    en: "“%{title}” wasn’t saved because recording stopped before it ended."
  skipped_silent:
    en: "“%{title}” wasn’t saved because no audio was captured."
  skipped_exists:
    en: "“%{title}” wasn’t saved because a file with the same name already exists."
  stopped_idle:
    en: "Recording stopped after %{minutes} minutes without playback."
