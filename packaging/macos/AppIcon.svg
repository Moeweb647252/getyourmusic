<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- GetYourMusic app icon. Source of truth for packaging/macos/AppIcon.icns
       (regenerate with scripts/make-icon.sh). macOS template: 824 px body on a 1024 px canvas. -->
  <defs>
    <linearGradient id="body" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#4B44A8"/>
      <stop offset="0.55" stop-color="#262265"/>
      <stop offset="1" stop-color="#0F0E2A"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vinyl" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.35" stop-color="#26252E"/>
      <stop offset="1" stop-color="#08080B"/>
    </radialGradient>
    <radialGradient id="sheen" cx="512" cy="512" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#FFFFFF" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </radialGradient>
    <linearGradient id="label" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6A5C"/>
      <stop offset="1" stop-color="#D8261B"/>
    </linearGradient>
    <radialGradient id="labelGlow" cx="512" cy="512" r="158" gradientUnits="userSpaceOnUse">
      <stop offset="0.7" stop-color="#FF3B30" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF3B30" stop-opacity="0"/>
    </radialGradient>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <filter id="discShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#05040F" flood-opacity="0.55"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="grooveArea">
      <path d="M215 512 a297 297 0 1 0 594 0 a297 297 0 1 0 -594 0 Z M396 512 a116 116 0 1 1 232 0 a116 116 0 1 1 -232 0 Z" clip-rule="evenodd"/>
    </clipPath>
    <!-- Fine grain dithers the dark gradient so it doesn't band at 8 bits per channel. -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)" filter="url(#iconShadow)"/>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" filter="url(#grain)" opacity="0.06"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#gloss)"/>

    <circle cx="512" cy="512" r="300" fill="url(#vinyl)" filter="url(#discShadow)"/>
    <circle cx="512" cy="512" r="134" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1.5"/>
    <circle cx="512" cy="512" r="143" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1.5"/>
    <circle cx="512" cy="512" r="152" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1.5"/>
    <circle cx="512" cy="512" r="161" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1.5"/>
    <circle cx="512" cy="512" r="170" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1.5"/>
    <circle cx="512" cy="512" r="179" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1.5"/>
    <circle cx="512" cy="512" r="188" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1.5"/>
    <circle cx="512" cy="512" r="197" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1.5"/>
    <circle cx="512" cy="512" r="206" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1.5"/>
    <circle cx="512" cy="512" r="215" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1.5"/>
    <circle cx="512" cy="512" r="224" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1.5"/>
    <circle cx="512" cy="512" r="233" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1.5"/>
    <circle cx="512" cy="512" r="242" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1.5"/>
    <circle cx="512" cy="512" r="251" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1.5"/>
    <circle cx="512" cy="512" r="260" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1.5"/>
    <circle cx="512" cy="512" r="269" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1.5"/>
    <circle cx="512" cy="512" r="278" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1.5"/>
    <circle cx="512" cy="512" r="287" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1.5"/>
    <circle cx="512" cy="512" r="178" fill="none" stroke="#000000" stroke-opacity="0.55" stroke-width="5"/>
    <circle cx="512" cy="512" r="181.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.5"/>
    <circle cx="512" cy="512" r="226" fill="none" stroke="#000000" stroke-opacity="0.55" stroke-width="5"/>
    <circle cx="512" cy="512" r="229.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.5"/>
    <g clip-path="url(#grooveArea)">
      <g filter="url(#soften)">
    <path d="M603.47 230.49 A296 296 0 0 1 773.35 373.04 L616.19 456.60 A118 118 0 0 0 548.46 399.78 Z" fill="url(#sheen)"/>
    <path d="M420.53 793.51 A296 296 0 0 1 250.65 650.96 L407.81 567.40 A118 118 0 0 0 475.54 624.22 Z" fill="url(#sheen)"/>
      </g>
    </g>
    <circle cx="512" cy="512" r="298.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3"/>

    <circle cx="512" cy="512" r="158" fill="url(#labelGlow)"/>
    <circle cx="512" cy="512" r="112" fill="url(#label)"/>
    <circle cx="512" cy="512" r="111" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"/>
    <circle cx="512" cy="512" r="86" fill="none" stroke="#7A0E08" stroke-opacity="0.28" stroke-width="2"/>
    <circle cx="512" cy="512" r="13" fill="#14132F"/>
    <circle cx="512" cy="512" r="13" fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="2"/>
  </g>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>
</svg>
